# Membangun Cognify untuk Windows di server GitHub. Berjalan manual (Actions > Run workflow).
# Hasilnya diunggah sebagai artifact dan dilampirkan ke rilis `tag` (dibuat sebagai pre-release bila belum ada).
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag rilis tujuan installer Windows
        default: v0.1.0-beta
        required: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: cognify-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Lampirkan ke rilis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "Cognify $TAG" --notes "Installer Windows (beta). / Windows installer (beta)."
          fi
          gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe --clobber
