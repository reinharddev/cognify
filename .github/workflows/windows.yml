# Membangun installer Windows (Velopack, satu klik) di server GitHub. Berjalan manual (Actions > Run workflow).
# Hasilnya diunggah sebagai artifact dan dilampirkan ke rilis `tag` (dibuat sebagai pre-release bila belum ada).
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag rilis tujuan installer Windows
        default: v0.1.0-beta
        required: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      # Hanya exe-nya; installer dibuat Velopack, bukan NSIS bawaan Tauri.
      - run: npm run tauri -- build --no-bundle
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet tool install -g vpk
      - name: Siapkan folder paket
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pack | Out-Null
          Copy-Item src-tauri/target/release/Cognify.exe pack/
          Copy-Item -Recurse extension pack/extension
      - name: Bangun installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          vpk pack --packId Cognify --packVersion $version --packDir pack --mainExe Cognify.exe `
            --packTitle "Cognify" --packAuthors "Reinhard Dave Yunardi" `
            --icon src-tauri/icons/icon.ico --splashImage src-tauri/installer/splash.png --outputDir Releases
      - uses: actions/upload-artifact@v4
        with:
          name: cognify-windows
          path: Releases/*
          if-no-files-found: error
      - name: Lampirkan ke rilis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "Cognify $TAG" --notes "Installer Windows (beta). / Windows installer (beta)."
          fi
          gh release upload "$TAG" Releases/* --clobber
