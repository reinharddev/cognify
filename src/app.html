<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cognify</title>
    <script>
      // Pasang tema, warna pilihan, dan huruf sebelum halaman digambar supaya tidak berkedip.
      // Nilainya disimpan oleh src/lib/stores/prefs.svelte.ts.
      (function () {
        try {
          var b = JSON.parse(localStorage.getItem("cognify.boot") || "{}");
          var root = document.documentElement;
          root.dataset.theme = "light";
          var vars = (b.vars && b.vars.light) || {};
          for (var k in vars) root.style.setProperty("--" + k, vars[k]);
          if (b.font) root.style.setProperty("--font", b.font);
          if (b.fs) root.style.setProperty("--fs", b.fs);
          if (b.motion === false) root.dataset.motion = "off";
          root.dataset.style = b.style === "normal" ? "normal" : "neo";
          // Jendela catatan melayang transparan: tanpa latar sejak awal supaya tidak berkedip putih.
          if (location.pathname.indexOf("/sticky/") === 0) root.classList.add("sticky-mode");
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
